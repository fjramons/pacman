name: CI

on:
  push:
    branches:
      - master
      - modernize
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # ESLint has no native/Mongo dependency, so no glibc needed here.
    container: node:20-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run build
        run: npm run build

  test-postgres:
    name: Test (Postgres)
    runs-on: ubuntu-latest
    needs: lint
    # "pg" driver is pure JS, no native/glibc dependency.
    container: node:20-alpine
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pacman
          POSTGRES_USER: pacman
          POSTGRES_PASSWORD: pacman
        options: >-
          --health-cmd "pg_isready -U pacman -d pacman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_DRIVER: postgres
      PGHOST: postgres   # not "localhost": the job runs inside a container, reachable via the service label
      PGPORT: 5432
      PGDATABASE: pacman
      PGUSER: pacman
      PGPASSWORD: pacman
      PGSSLMODE: disable
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        run: npm ci
      - name: Run Postgres integration tests
        run: npm run test:postgres

  k8s-deploy-test:
    name: E2E (kind)
    runs-on: ubuntu-latest
    needs: [build, test-postgres]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pacman-ci
          version: v0.24.0
          kubectl_version: v1.31.0
          wait: 90s

      # Must match the local/pacman:dev tag the overlay substitution below produces, or the pod gets ImagePullBackOff.
      - name: Build image
        run: docker build -t local/pacman:dev .

      - name: Load image into kind
        run: kind load docker-image local/pacman:dev --name pacman-ci

      - name: Point Kustomize overlay at the freshly built image
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gettext-base
          IMAGE_REGISTRY=local IMAGE_NAME=pacman IMAGE_TAG=dev \
            envsubst < k8s/kustomize/overlays/image/kustomization.yaml.template \
            > k8s/kustomize/overlays/image/kustomization.yaml
      - name: Deploy all-in-one overlay
        run: kubectl apply -k k8s/kustomize/overlays/all-in-one

      - name: Wait for Postgres
        run: kubectl -n pacman wait --for=condition=Ready pod -l app=postgres --timeout=60s

      - name: Wait for schema Job
        run: kubectl -n pacman wait --for=condition=Complete job/pacman-schema --timeout=90s

      - name: Wait for pacman-app
        run: kubectl -n pacman wait --for=condition=Ready pod -l app=pacman-app --timeout=90s

      # port-forward proxies via the API server, unaffected by "type: LoadBalancer" staying <pending> on this runner.
      - name: Check /healthz
        run: |
          kubectl -n pacman port-forward svc/pacman-app 18080:80 &
          PF_PID=$!
          ok=false
          for i in $(seq 1 15); do
            if curl -sf http://localhost:18080/healthz; then
              echo
              echo "healthz OK"
              ok=true
              break
            fi
            sleep 2
          done
          kill "$PF_PID" 2>/dev/null || true
          if [ "$ok" != "true" ]; then
            echo "healthz check failed" >&2
            exit 1
          fi

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n pacman get all,jobs
          kubectl -n pacman describe pods
          kubectl -n pacman logs -l app=pacman-app --all-containers --tail=200 || true
          kubectl -n pacman logs job/pacman-schema --tail=200 || true
          kubectl -n pacman logs -l app=postgres --tail=200 || true
