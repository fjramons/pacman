services:
  pacman-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-pacman}
      POSTGRES_USER: ${PGUSER:-pacman}
      POSTGRES_PASSWORD: ${PGPASSWORD:-pacman}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-pacman} -d ${PGDATABASE:-pacman}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "${PGPORT:-5432}:5432"

  pacman-app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      pacman-postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-8080}
      NODE_ENV: ${NODE_ENV:-production}
      DB_DRIVER: ${DB_DRIVER:-postgres}
      PGHOST: ${PGHOST:-pacman-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-pacman}
      PGUSER: ${PGUSER:-pacman}
      PGPASSWORD: ${PGPASSWORD:-pacman}
      PGSSLMODE: ${PGSSLMODE:-disable}
      MONGO_SERVICE_HOST: ${MONGO_SERVICE_HOST}
      MY_MONGO_PORT: ${MY_MONGO_PORT}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_USE_SSL: ${MONGO_USE_SSL}
      MONGO_VALIDATE_SSL: ${MONGO_VALIDATE_SSL}
      MONGO_AUTH_USER: ${MONGO_AUTH_USER}
      MONGO_AUTH_PWD: ${MONGO_AUTH_PWD}
      MONGO_REPLICA_SET: ${MONGO_REPLICA_SET}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"

  pacman-load:
    image: mcr.microsoft.com/playwright:v1.56.0-jammy
    # Opt-in only: without a profile, "docker compose up" would start this
    # too and it would run forever by default (LOAD_TEST_MAX_ITERATIONS=0),
    # flooding a casual tester's highscore table with bot traffic. Start it
    # explicitly with "docker compose run --rm pacman-load" instead.
    profiles: ["load"]
    depends_on:
      - pacman-app
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
    environment:
      LOAD_TEST_BASE_URL: ${LOAD_TEST_BASE_URL:-http://pacman-app:${PORT:-8080}}
      LOAD_TEST_VUS: ${LOAD_TEST_VUS:-5}
      LOAD_TEST_MIN_SESSION: ${LOAD_TEST_MIN_SESSION:-10}
      LOAD_TEST_MAX_SESSION: ${LOAD_TEST_MAX_SESSION:-30}
      LOAD_TEST_THINK_TIME_MS: ${LOAD_TEST_THINK_TIME_MS:-750}
      LOAD_TEST_MAX_SCORE: ${LOAD_TEST_MAX_SCORE:-5000}
      LOAD_TEST_MAX_LEVEL: ${LOAD_TEST_MAX_LEVEL:-25}
      LOAD_TEST_MAX_LIVES: ${LOAD_TEST_MAX_LIVES:-5}
    entrypoint: ["sh", "-c", "npm ci && npm run load:test"]

volumes:
  postgres-data:
