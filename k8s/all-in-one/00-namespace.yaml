---
# Duplicated from k8s/base/00-namespace.yaml on purpose: trivial, stable
# content, and having it here lets this directory stand on its own instead
# of mixing paths from both directories. Named with a "00-" prefix, like
# its k8s/base/ counterpart, so a plain "*.yaml" glob applies it first:
# kubectl doesn't reorder a concatenated/directory apply by resource kind,
# so without this the Namespace wouldn't exist yet when configmap.yaml or
# deployment.yaml (earlier alphabetically otherwise) get applied.
apiVersion: v1
kind: Namespace
metadata:
  name: pacman
