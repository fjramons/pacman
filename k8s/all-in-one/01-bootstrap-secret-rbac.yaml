---
# Scoped to get/create Secrets in this namespace only, used by 02-bootstrap-secret-job.yaml. "01-" applies this before the Job that needs it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pacman-secret-bootstrapper
  namespace: pacman
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pacman-secret-bootstrapper
  namespace: pacman
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pacman-secret-bootstrapper
  namespace: pacman
subjects:
  - kind: ServiceAccount
    name: pacman-secret-bootstrapper
    namespace: pacman
roleRef:
  kind: Role
  name: pacman-secret-bootstrapper
  apiGroup: rbac.authorization.k8s.io
