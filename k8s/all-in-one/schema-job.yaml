---
# Duplicated from k8s/base/schema-job.yaml, kept in sync by hand; see k8s/all-in-one/README.md.
#
# Idempotent: schema.sql uses CREATE TABLE/INDEX IF NOT EXISTS. Delete the completed Job first (`kubectl delete job pacman-schema -n pacman`) if K8s complains about immutable fields on reapply.
apiVersion: batch/v1
kind: Job
metadata:
  name: pacman-schema
  namespace: pacman
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: apply-schema
          image: ${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          command: ["node", "scripts/apply-schema.js"]
          envFrom:
            - configMapRef:
                name: pacman-config
            - secretRef:
                name: pacman-db-credentials
