---
# Fixed dummy credentials for casual testing, not the ${...}-placeholder
# pattern used in k8s/base/. Same name (pacman-db-credentials) as
# k8s/base/secret.yaml on purpose: k8s/base/deployment.yaml and
# k8s/base/schema-job.yaml reference it by that name unmodified. Carries
# both key sets: PGUSER/PGPASSWORD for the app container, POSTGRES_*
# for the bundled postgres container's own init.
apiVersion: v1
kind: Secret
metadata:
  name: pacman-db-credentials
  namespace: pacman
type: Opaque
stringData:
  PGUSER: pacman
  PGPASSWORD: pacman
  POSTGRES_DB: pacman
  POSTGRES_USER: pacman
  POSTGRES_PASSWORD: pacman
