# Deploys this fork's dev environment by pull (ArgoCD) instead of the direct "kubectl apply -k" push documented in the root README. "kubectl apply -f" is idempotent, so this same manifest works both for the very first apply and any later resync.
#
# pacman-db-config/pacman-db-credentials are NOT generated by overlays/dev/ itself (see k8s/kustomize/README.md): they must already exist in the pacman-dev namespace before this Application is applied, created by whatever manages that namespace (a CI pipeline, a script, by hand for a quick try). See k8s/argocd/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pacman-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fjramons/pacman.git
    targetRevision: main
    path: k8s/kustomize/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: pacman-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
