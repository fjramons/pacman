# Deploys the dev environment by pull (ArgoCD) instead of "kubectl apply -k". Idempotent: works for both the first apply and any later resync.
#
# pacman-db-config/pacman-db-credentials must already exist in the pacman-dev namespace before this Application is applied; see k8s/argocd/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pacman-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fjramons/pacman.git
    targetRevision: main
    path: k8s/kustomize/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: pacman-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
