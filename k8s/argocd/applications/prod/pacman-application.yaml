# Same design as ../dev/pacman-application.yaml, see its comments.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pacman-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fjramons/pacman.git
    targetRevision: main
    path: k8s/kustomize/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: pacman-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
