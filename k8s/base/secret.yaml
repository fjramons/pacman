---
# Only ever commit this file with the ${...} placeholders unresolved.
# Render it with envsubst at deploy time (see k8s/README.md) and never
# write the rendered output back into git.
apiVersion: v1
kind: Secret
metadata:
  name: pacman-db-credentials
  namespace: pacman
type: Opaque
stringData:
  PGUSER: "${DB_USER}"
  PGPASSWORD: "${DB_PASSWORD}"
