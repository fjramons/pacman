---
# NOT part of the default deployment: see README.md in this directory.
# ${GATEWAY_NAME}/${GATEWAY_NAMESPACE}: name and namespace of the Gateway
# resource in the target cluster (find it with `kubectl get gateway -A`).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pacman-app
  namespace: pacman
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
      namespace: ${GATEWAY_NAMESPACE}
  rules:
    - backendRefs:
        - name: pacman-app
          port: 80
