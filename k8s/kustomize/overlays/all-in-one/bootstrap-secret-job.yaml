# Get-or-create: creates pacman-db-credentials with a random PGPASSWORD/POSTGRES_PASSWORD on first apply, leaves it untouched on later reapplies. See README.md (Design).
#
# This Job's own spec never changes between runs, so a plain reapply is a no-op; only editing this file needs `kubectl delete job pacman-bootstrap-secret -n pacman` first, same immutable-field constraint as pacman-schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: pacman-bootstrap-secret
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: pacman-secret-bootstrapper
      containers:
        - name: bootstrap-secret
          image: alpine/k8s:1.36.2
          command:
            - sh
            - -c
            - |
              set -eu
              if ! kubectl get secret pacman-db-credentials -n pacman >/dev/null 2>&1; then
                PASSWORD=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c24)
                kubectl create secret generic pacman-db-credentials -n pacman \
                  --from-literal=PGUSER=pacman \
                  --from-literal=PGPASSWORD="${PASSWORD}" \
                  --from-literal=POSTGRES_DB=pacman \
                  --from-literal=POSTGRES_USER=pacman \
                  --from-literal=POSTGRES_PASSWORD="${PASSWORD}"
              fi
