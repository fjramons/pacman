# Scoped to get/create Secrets in this namespace only, used by bootstrap-secret-job.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pacman-secret-bootstrapper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pacman-secret-bootstrapper
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pacman-secret-bootstrapper
subjects:
  - kind: ServiceAccount
    name: pacman-secret-bootstrapper
roleRef:
  kind: Role
  name: pacman-secret-bootstrapper
  apiGroup: rbac.authorization.k8s.io
