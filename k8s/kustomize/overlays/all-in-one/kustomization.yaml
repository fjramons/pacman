apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pacman

resources:
  - bootstrap-secret-rbac.yaml
  - bootstrap-secret-job.yaml
  - ../image
  - postgres-deployment.yaml
  - postgres-service.yaml

# Static, non-secret connection values: pacman-db-credentials is created separately by bootstrap-secret-job.yaml instead (see README, Design), never a secretGenerator here.
configMapGenerator:
  - name: pacman-db-config
    literals:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=pacman
      - PGSSLMODE=disable
