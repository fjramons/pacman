apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pacman

resources:
  - ../image
  - postgres-deployment.yaml
  - postgres-service.yaml

# Fixed dummy values, not env files: this is a casual-testing convenience,
# the database connection is always the bundled postgres-service.yaml in
# this same namespace, never external. Safe to commit, same as the
# equivalent k8s/all-in-one/secret.yaml in the envsubst mode.
configMapGenerator:
  - name: pacman-db-config
    literals:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=pacman
      - PGSSLMODE=disable

secretGenerator:
  - name: pacman-db-credentials
    literals:
      - PGUSER=pacman
      - PGPASSWORD=pacman
      - POSTGRES_DB=pacman
      - POSTGRES_USER=pacman
      - POSTGRES_PASSWORD=pacman
