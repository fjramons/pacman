# ClusterIP (default): only reachable from inside this cluster, unlike
# k8s/pg-sim/service.yaml (LoadBalancer, meant to be reached from a
# separate cluster). Named "postgres" to match PGHOST in the generated
# pacman-db-config ConfigMap (see kustomization.yaml).
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
