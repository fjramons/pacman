# For a GitOps controller (e.g. ArgoCD), not manual "kubectl apply -k": unlike external-db/all-in-one, doesn't generate pacman-db-config/pacman-db-credentials from .env files, only references them by name. See k8s/argocd/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pacman-dev

resources:
  - ../image
