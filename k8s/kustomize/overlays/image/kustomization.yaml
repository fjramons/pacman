# Default: always the latest published image. See k8s/kustomize/README.md (Design) for the less common freshly-built-image case.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: pacman
    newName: ghcr.io/fjramons/pacman
    newTag: latest

# "latest" is a mutable tag, so imagePullPolicy is patched to Always here. See k8s/kustomize/README.md (Design).
patches:
  - target:
      kind: Deployment
      name: pacman-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Job
      name: pacman-schema
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
