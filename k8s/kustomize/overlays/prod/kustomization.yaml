# Same design as ../dev, see its comment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pacman-prod

resources:
  - ../image

# Only illustrative dev/prod difference in this example: more replicas.
patches:
  - target:
      kind: Deployment
      name: pacman-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
