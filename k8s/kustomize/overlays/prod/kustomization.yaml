# Mismo diseño que ../dev, ver el comentario ahí: pensado para un controlador GitOps, pacman-db-config/pacman-db-credentials se asumen ya existentes en el namespace, no generados por este overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pacman-prod

resources:
  - ../image

# Único toque ilustrativo de diferencia dev/prod en este ejemplo: más réplicas, no una base de datos ni una imagen distintas (ver el propio README de este directorio para por qué ambas comparten todo lo demás).
patches:
  - target:
      kind: Deployment
      name: pacman-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
