---
# Local test env only: fixed dummy credentials, not the ${...}-placeholder
# pattern used in k8s/base/. This simulates the DB the client's Terraform
# module would provision, it never touches anything real.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: pg-sim
type: Opaque
stringData:
  POSTGRES_DB: pacman
  POSTGRES_USER: pacman
  POSTGRES_PASSWORD: pacman
